input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://db:5432/scoring"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"
    schedule => "*/1 * * * *"
    statement => "SELECT id, timestamp, username, client_id, probabilite_defaut, risque, execution_time_ms, status_code, error_message, features::text AS features FROM prediction_logs ORDER BY timestamp DESC LIMIT 100"
    use_column_value => true
    tracking_column => "timestamp"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run"
  }
}

filter {
  mutate {
    copy => { "timestamp" => "@timestamp" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "prediction-logs"
    document_id => "%{id}"
  }
  stdout { codec => rubydebug }
}