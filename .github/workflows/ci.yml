name: CI - Tests Backend

on:
  push:
    branches:
      - staging
      - stagging   # au cas où le nom de la branche est mal orthographié
  pull_request:
    branches:
      - staging
      - stagging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          pytest api/backend/test_unit.py api/backend/test_integration.py -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml