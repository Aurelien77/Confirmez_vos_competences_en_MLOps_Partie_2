name: CI - Tests Backend & Frontend

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  read-config:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.config.outputs.backend }}
      frontend: ${{ steps.config.outputs.frontend }}
      create_artifact: ${{ steps.config.outputs.create_artifact }}
      enable_versioning: ${{ steps.config.outputs.enable_versioning }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          echo "backend=$(yq '.backend' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "frontend=$(yq '.frontend' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "create_artifact=$(yq '.create_artifact' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "enable_versioning=$(yq '.enable_versioning // "false"' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "version=$(yq '.version // "dev"' .github/test-config.yml)" >> $GITHUB_OUTPUT

  test-backend:
    needs: read-config
    if: |
      needs.read-config.outputs.backend == 'true' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/stagging' || 
       (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'stagging'))) &&
      (github.event_name == 'push' || github.event.pull_request.head.ref != 'dev')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest pytest-cov httpx
      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/scoring
        run: |
          pytest api/backend/test_unit.py api/backend/test_integration.py \
            -v \
            --cov=api/backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml \
            --ignore=api/backend/test_integration.py::test_frontend_ui
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
      - name: Coverage summary
        if: always()
        run: |
          echo "## Couverture de code" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  test-frontend:
    needs: read-config
    if: |
      needs.read-config.outputs.frontend == 'true' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/stagging' || 
       (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'stagging'))) &&
      (github.event_name == 'push' || github.event.pull_request.head.ref != 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest httpx
      - name: Run frontend tests
        run: |
          pytest api/backend/test_integration.py::test_frontend_ui -v --junitxml=frontend-test-results.xml
      - name: Frontend test summary
        if: always()
        run: |
          echo "## Résultats tests Frontend" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend-test-results.xml ]; then
            total=$(grep -oP 'tests="\K[0-9]+' frontend-test-results.xml | head -1 || echo 0)
            failures=$(grep -oP 'failures="\K[0-9]+' frontend-test-results.xml | head -1 || echo 0)
            errors=$(grep -oP 'errors="\K[0-9]+' frontend-test-results.xml | head -1 || echo 0)
            skipped=$(grep -oP 'skipped="\K[0-9]+' frontend-test-results.xml | head -1 || echo 0)
            echo "| Tests | Réussis | Échecs | Erreurs | Skippés |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|---------|--------|---------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| $total | $((total - failures - errors - skipped)) | $failures | $errors | $skipped |" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend-test-results.xml

  create-artifact:
    needs: [read-config, test-backend, test-frontend]
    if: |
      needs.read-config.outputs.create_artifact == 'true' &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create application archive
        run: |
          mkdir -p artifact
          cp -r api/ artifact/
          cp -r devops/ artifact/
          cp -r learning_models/ artifact/ 2>/dev/null || true
          tar -czf application.tar.gz -C artifact .
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: application.tar.gz
          retention-days: 30

  create-versioned-artifact:
    needs: [read-config, test-backend, test-frontend]
    if: |
      needs.read-config.outputs.enable_versioning == 'true' &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create versioned artifact
        run: |
          VERSION="${{ needs.read-config.outputs.version }}"
          mkdir -p artifact
          cp -r api/ artifact/
          cp -r devops/ artifact/
          cp -r learning_models/ artifact/ 2>/dev/null || true
          echo "Version: $VERSION" > artifact/VERSION
          echo "Commit: ${{ github.sha }}" >> artifact/VERSION
          tar -czf application-${VERSION}.tar.gz -C artifact .
      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ needs.read-config.outputs.version }}
          path: application-*.tar.gz
          retention-days: 90