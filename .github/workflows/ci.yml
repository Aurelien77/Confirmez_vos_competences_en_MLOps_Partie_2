name: CI - Tests Backend & Frontend

on:
  push:
    branches: [staging, stagging]
  pull_request:
    branches: [staging, stagging]
  workflow_dispatch:

jobs:
  read-config:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.config.outputs.backend }}
      frontend: ${{ steps.config.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          echo "backend=$(yq '.backend' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "frontend=$(yq '.frontend' .github/test-config.yml)" >> $GITHUB_OUTPUT

  test-backend:
    needs: read-config
    if: needs.read-config.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/scoring
        run: |
          pytest api/backend/test_unit.py api/backend/test_integration.py \
            -v \
            --cov=api/backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml \
            --ignore=api/backend/test_integration.py::test_frontend_ui

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Coverage summary
        if: always()
        run: |
          echo "## Couverture de code" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  test-frontend:
    needs: read-config
    if: needs.read-config.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest httpx

      - name: Run frontend tests
        run: |
          pytest api/backend/test_integration.py::test_frontend_ui -v --junitxml=frontend-test-results.xml

      - name: Frontend test summary
        if: always()
        run: |
          echo "## Résultats tests Frontend" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend-test-results.xml ]; then
            echo "Tests frontend exécutés" >> $GITHUB_STEP_SUMMARY
          else
            echo "Aucun résultat frontend" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend-test-results.xml