name: CI/CD Pipeline

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  read-config:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.config.outputs.backend }}
      frontend: ${{ steps.config.outputs.frontend }}
      create_artifact: ${{ steps.config.outputs.create_artifact }}
      enable_versioning: ${{ steps.config.outputs.enable_versioning }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          echo "backend=$(yq '.backend' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "frontend=$(yq '.frontend' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "create_artifact=$(yq '.create_artifact' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "enable_versioning=$(yq '.enable_versioning // "false"' .github/test-config.yml)" >> $GITHUB_OUTPUT
          echo "version=$(yq '.version // "dev"' .github/test-config.yml)" >> $GITHUB_OUTPUT

  test-backend:
    needs: read-config
    if: |
      needs.read-config.outputs.backend == 'true' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/stagging')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 postgresql-client
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest pytest-cov httpx
      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d scoring << 'EOF'
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username VARCHAR(50) UNIQUE NOT NULL,
              hashed_password VARCHAR(255) NOT NULL,
              role VARCHAR(20) DEFAULT 'user',
              created_at TIMESTAMP DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS prediction_logs (
              id SERIAL PRIMARY KEY,
              timestamp TIMESTAMPTZ DEFAULT NOW(),
              username VARCHAR(50),
              client_id INTEGER,
              features JSONB,
              probabilite_defaut DOUBLE PRECISION,
              risque INTEGER,
              execution_time_ms DOUBLE PRECISION,
              status_code INTEGER,
              error_message TEXT
          );

          CREATE INDEX IF NOT EXISTS idx_logs_timestamp ON prediction_logs(timestamp);
          CREATE INDEX IF NOT EXISTS idx_logs_client_id ON prediction_logs(client_id);
          CREATE INDEX IF NOT EXISTS idx_logs_username ON prediction_logs(username);
          EOF
      - name: Run backend tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/scoring
        run: |
          pytest api/backend/test_unit.py api/backend/test_integration.py \
            -v \
            --cov=api/backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml \
            --ignore=api/backend/test_integration.py::test_frontend_ui
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
      - name: Coverage summary
        if: always()
        run: |
          echo "## Couverture de code" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  test-frontend:
    needs: read-config
    if: |
      needs.read-config.outputs.frontend == 'true' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/stagging')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r api/backend/requirements.txt
          pip install pytest httpx
      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d scoring << 'EOF'
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              username VARCHAR(50) UNIQUE NOT NULL,
              hashed_password VARCHAR(255) NOT NULL,
              is_admin BOOLEAN DEFAULT FALSE,
              created_at TIMESTAMP DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS prediction_logs (
              id SERIAL PRIMARY KEY,
              timestamp TIMESTAMPTZ DEFAULT NOW(),
              username VARCHAR(50),
              client_id INTEGER,
              features JSONB,
              probabilite_defaut DOUBLE PRECISION,
              risque INTEGER,
              execution_time_ms DOUBLE PRECISION,
              status_code INTEGER,
              error_message TEXT
          );

          CREATE INDEX IF NOT EXISTS idx_logs_timestamp ON prediction_logs(timestamp);
          CREATE INDEX IF NOT EXISTS idx_logs_client_id ON prediction_logs(client_id);
          CREATE INDEX IF NOT EXISTS idx_logs_username ON prediction_logs(username);
          EOF
      - name: Run frontend tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/scoring
        run: |
          pytest api/backend/test_integration.py::test_frontend_ui -v --junitxml=frontend-test-results.xml
      - name: Frontend test summary
        if: always()
        run: |
          echo "## Résultats des tests frontend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f frontend-test-results.xml ]; then
            python3 - << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse("frontend-test-results.xml")
              root = tree.getroot()
              tests = int(root.get("tests", 0))
              failures = int(root.get("failures", 0))
              errors = int(root.get("errors", 0))
              skipped = int(root.get("skipped", 0))
              passed = tests - failures - errors - skipped

              print("| Tests | Passés | Échecs | Erreurs | Ignorés |")
              print("|-------|--------|--------|---------|---------|")
              print(f"| {tests} | {passed} | {failures} | {errors} | {skipped} |")
              print("")
              print("### Détail des tests")
              print("")

              for testcase in root.iter("testcase"):
                  name = testcase.get("name", "inconnu")
                  classname = testcase.get("classname", "")
                  time_val = testcase.get("time", "0")
                  status = "PASSED"
                  if testcase.find("failure") is not None:
                      status = "FAILED"
                  elif testcase.find("error") is not None:
                      status = "ERROR"
                  elif testcase.find("skipped") is not None:
                      status = "SKIPPED"
                  
                  print(f"- **{name}** — {status} — {time_val}s")
                  print(f"  - Fichier : `{classname}`")
          except Exception as e:
              print(f"Impossible de parser le XML : {e}")
          PYEOF
          else
            echo "Aucun fichier de résultats frontend trouvé" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend-test-results.xml

  create-artifact:
    needs: [read-config, test-backend, test-frontend]
    if: |
      needs.read-config.outputs.create_artifact == 'true' &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create application archive
        run: |
          mkdir -p artifact
          cp -r api/ artifact/
          cp -r devops/ artifact/
          cp -r learning_models/ artifact/ 2>/dev/null || true
          tar -czf application.tar.gz -C artifact .
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: application.tar.gz
          retention-days: 30

  semantic-release:
    needs: [read-config, test-backend, test-frontend]
    if: |
      needs.read-config.outputs.enable_versioning == 'true' &&
      github.ref == 'refs/heads/main' &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

  download-artifact:
    needs: read-config
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact_found: ${{ steps.check.outputs.found }}
    steps:
      - name: Download latest successful artifact from stagging
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci-cd.yml
          branch: stagging
          name: application-build
          path: ./artifact
          if_no_artifact_found: warn
          workflow_conclusion: success
      - name: List downloaded files
        run: |
          echo "=== Contenu du dossier artifact ==="
          ls -laR ./artifact/ || echo "Dossier vide ou inexistant"
      - name: Check artifact
        id: check
        run: |
          if [ -f ./artifact/application.tar.gz ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Artefact trouvé"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Aucun artefact trouvé sur stagging"
          fi

  build-and-push:
    needs: [download-artifact, semantic-release]
    if: needs.download-artifact.outputs.artifact_found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${{ env.REGISTRY }}/${REPO}/api" >> $GITHUB_OUTPUT
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}

  deploy:
    needs: [download-artifact, build-and-push]
    if: needs.download-artifact.outputs.artifact_found == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scoring.1dream.art
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts
      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt
      - name: Deploy
        working-directory: devops/ansible
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ansible-playbook -i inventory/hosts.yml playbook_deploy.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -e "registry_user=${{ github.actor }}" \
            -e "registry_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "ci_registry_image=${{ env.REGISTRY }}/${REPO}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
      - name: Cleanup
        if: always()
        run: rm -f /tmp/vault_pass.txt ~/.ssh/deploy_key