name: CD - Déploiement Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  download-artifact:
    runs-on: ubuntu-latest
    outputs:
      artifact_found: ${{ steps.check.outputs.found }}
    steps:
      - name: Download latest application artifact from staging
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          branch: staging
          name: application-build
          path: ./artifact
          if_no_artifact_found: warn

      - name: Check artifact
        id: check
        run: |
          if [ -f ./artifact/application.tar.gz ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  build-and-push:
    needs: download-artifact
    if: needs.download-artifact.outputs.artifact_found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${{ env.REGISTRY }}/${REPO}/api" >> $GITHUB_OUTPUT

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}

  deploy:
    needs: [download-artifact, build-and-push]
    if: needs.download-artifact.outputs.artifact_found == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scoring.1dream.art
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass.txt

      - name: Deploy
        working-directory: devops/ansible
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ansible-playbook -i inventory/hosts.yml playbook_deploy.yml \
            --vault-password-file /tmp/vault_pass.txt \
            -e "registry_user=${{ github.actor }}" \
            -e "registry_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "ci_registry_image=${{ env.REGISTRY }}/${REPO}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/vault_pass.txt